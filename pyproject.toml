[project]
name = "svacer-triage"
version = "1.0.4"
description = "Evidence-driven Svace/Svacer SAST marker triage"
requires-python = ">=3.10,<3.15"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.30.0",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2,<3.0"

[tool.poetry.group.desktop]
optional = true

[tool.poetry.group.desktop.dependencies]
PySide6 = "6.11.2"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pytest = "9.1.1"

[tool.pytest.ini_options]
testpaths = ["app/tests"]
norecursedirs = [".git", ".venv", ".tools", "RESULTS", "ARCHIVE", "logs"]

[build-system]
requires = ["poetry-core>=2.2,<3.0"]
build-backend = "poetry.core.masonry.api"
