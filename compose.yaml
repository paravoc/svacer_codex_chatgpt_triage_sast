services:
  svacer-triage:
    build:
      context: .
      args:
        CODEX_CLI_VERSION: "0.155.0-alpha.9.2"
        POETRY_VERSION: "2.2.1"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SVACER_WEB_PORT:-8080}:8080"
    environment:
      SVACER_URL: ${SVACER_URL:?Set SVACER_URL}
      SVACER_ALLOWED_HOSTS: ${SVACER_ALLOWED_HOSTS:-localhost,127.0.0.1}
      SVACER_COOKIE_SECURE: ${SVACER_COOKIE_SECURE:-1}
      SVACER_PARALLEL_WORKERS: ${SVACER_PARALLEL_WORKERS:-3}
      SVACER_VERIFICATION_WORKERS: ${SVACER_VERIFICATION_WORKERS:-2}
      SVACER_AUTH_TYPE: ${SVACER_AUTH_TYPE:-}
      SVACER_LDAP_SERVER: ${SVACER_LDAP_SERVER:-}
      SVACER_LOGIN_FILE: /run/secrets/svacer_login
      SVACER_PASSWORD_FILE: /run/secrets/svacer_password
      SVACER_WEB_TOKEN_FILE: /run/secrets/svacer_web_token
      CODEX_API_KEY_FILE: /run/secrets/codex_api_key
    secrets:
      - svacer_login
      - svacer_password
      - svacer_web_token
      - codex_api_key
    volumes:
      - svacer-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  svacer_login:
    file: ${SVACER_LOGIN_SECRET_FILE:?Set SVACER_LOGIN_SECRET_FILE}
  svacer_password:
    file: ${SVACER_PASSWORD_SECRET_FILE:?Set SVACER_PASSWORD_SECRET_FILE}
  svacer_web_token:
    file: ${SVACER_WEB_TOKEN_SECRET_FILE:?Set SVACER_WEB_TOKEN_SECRET_FILE}
  codex_api_key:
    file: ${CODEX_API_KEY_SECRET_FILE:?Set CODEX_API_KEY_SECRET_FILE}

volumes:
  svacer-data:
